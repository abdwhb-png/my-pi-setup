name: Private Pi profile qualification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Approved my-pi-setup main commit (full SHA)
        type: string
        required: true
      candidate_release:
        description: Private draft containing the exact setup.tgz and release.json to qualify
        type: string
        required: true
      candidate_sha256:
        description: Expected SHA-256 of setup.tgz
        type: string
        required: true
      publish:
        description: Publish this same draft only after complete qualification succeeds
        type: boolean
        default: false
      providers:
        description: Authorize the configured provider calls (may incur charges)
        type: boolean
        default: false
      profile_only:
        description: Diagnose a fresh profile install without repeating update and rollback checks
        type: boolean
        default: false
      catalog_only:
        description: Inspect selected provider auth and catalog prices without generation
        type: boolean
        default: false
      provider_budget_usd:
        description: Approved maximum USD using model prices (0 permits zero-priced models only)
        type: string
        default: '0'

run-name: Pi setup ${{ inputs.candidate_release }}

permissions:
  contents: read

concurrency:
  group: private-pi-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'abdwhb-png/my-pi-distribution' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Require a private repository and immutable releases
        env:
          GH_TOKEN: ${{ secrets.PI_DISTRIBUTION_TOKEN || github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PROVIDERS: ${{ inputs.providers }}
          CATALOG_ONLY: ${{ inputs.catalog_only }}
          CANDIDATE_RELEASE: ${{ inputs.candidate_release }}
          PUBLISH: ${{ inputs.publish }}
          PROFILE_ONLY: ${{ inputs.profile_only }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          DISTRIBUTION_TOKEN_PRESENT: ${{ secrets.PI_DISTRIBUTION_TOKEN != '' }}
        run: |
          set -euo pipefail
          if test "$PROVIDERS" = true && test "$CATALOG_ONLY" = true; then
            echo 'Choose either catalog inspection or generation.'
            exit 1
          fi
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CANDIDATE_RELEASE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,100}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          [[ "$CANDIDATE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          if test "$PUBLISH" = true; then
            test "$PROFILE_ONLY" != true || { echo 'Publication requires full qualification.'; exit 1; }
            test "$DISTRIBUTION_TOKEN_PRESENT" = true || { echo 'Publication requires PI_DISTRIBUTION_TOKEN.'; exit 1; }
            test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" = true
          fi
          test "$(gh release view "$CANDIDATE_RELEASE" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: abdwhb-png/my-pi-setup
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the approved main revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Qualify private distribution on a disposable runner
        env:
          GH_TOKEN: ${{ secrets.PI_DISTRIBUTION_TOKEN || github.token }}
          QUALIFICATION_PLATFORM: ubuntu
          QUALIFICATION_MODE: private
          QUALIFICATION_PROFILE_ONLY: ${{ inputs.profile_only }}
          QUALIFICATION_SOURCE_SHA: ${{ inputs.source_sha }}
          QUALIFICATION_RELEASE: ${{ inputs.candidate_release }}
          QUALIFICATION_ARCHIVE_SHA256: ${{ inputs.candidate_sha256 }}
        run: bash .github/scripts/qualify-portable-setup.sh private "$RUNNER_TEMP/private-qualification"
      - name: Load installed resources and qualify explicitly selected providers
        env:
          PI_QUALIFICATION_AUTH_JSON: ${{ secrets.PI_QUALIFICATION_AUTH_JSON }}
          PI_QUALIFICATION_PROVIDER_SECRETS_JSON: ${{ secrets.PI_QUALIFICATION_PROVIDER_SECRETS_JSON }}
          PI_QUALIFICATION_PROVIDER_CASES: ${{ vars.PI_QUALIFICATION_PROVIDER_CASES }}
          QUALIFICATION_PROVIDERS: ${{ inputs.providers }}
          QUALIFICATION_CATALOG_ONLY: ${{ inputs.catalog_only }}
          QUALIFICATION_PROVIDER_BUDGET: ${{ inputs.provider_budget_usd }}
          QUALIFICATION_SOURCE_SHA: ${{ inputs.source_sha }}
          QUALIFICATION_ARCHIVE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          export HOME="$RUNNER_TEMP/private-qualification/destination home é portable setup"
          export PI_CODING_AGENT_DIR="$HOME/.pi/agent"
          export PATH="$RUNNER_TEMP/private-qualification/host/node_modules/.bin:$PATH"
          export PI_OFFLINE=1
          # Third-party startup/provider output can contain credentials; never publish this log.
          if ! timeout --kill-after=10s 300s bun .github/scripts/qualify-installed-profile.ts "$HOME/.pi" "$RUNNER_TEMP/private-qualification/evidence/profile.json" > "$RUNNER_TEMP/private-profile.log" 2>&1; then
            echo 'Installed profile/provider verification failed. No credential-bearing log is uploaded.'
            exit 1
          fi
      - name: Publish the qualified draft and verify client downloads
        if: ${{ success() && inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.PI_DISTRIBUTION_TOKEN }}
        run: bun .github/scripts/finalize-portable-setup.ts "$GITHUB_WORKSPACE" "$RUNNER_TEMP/private-qualification/release-one" "$RUNNER_TEMP/private-qualification/evidence"
      - name: Preserve only structured private evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: private-portability-evidence
          path: |
            ${{ runner.temp }}/private-qualification/evidence/result.json
            ${{ runner.temp }}/private-qualification/evidence/qualification.json
            ${{ runner.temp }}/private-qualification/evidence/profile.json
            ${{ runner.temp }}/private-qualification/evidence/publication.json
            ${{ runner.temp }}/private-qualification/release-one/candidate.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove credentials and private scratch data
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/private-profile.log"
          if test -d "$RUNNER_TEMP/private-qualification"; then
            chmod -R u+w "$RUNNER_TEMP/private-qualification"
            rm -rf -- "$RUNNER_TEMP/private-qualification"
          fi
