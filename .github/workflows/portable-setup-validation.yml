name: Portable Pi setup qualification

on:
  push:
    branches: ['develop', 'main']
  workflow_dispatch:
    inputs:
      native_runtime_run_id:
        description: 'Reuse a qualified native runtime from a portable setup run with unchanged native inputs'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  resource-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Reject unclassified versioned setup resources
        run: bun -e 'import {auditDistributionResources} from "./agent/bin/setup/distribution.ts"; console.log(auditDistributionResources(process.cwd(), "HEAD").counts);'

  tool-discovery:
    needs: resource-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    strategy:
      fail-fast: false
      matrix:
        layout: [system, mise]
    steps:
      - name: Prepare a fresh container and unprivileged qualification user
        run: |
          set -eu
          test ! -e /usr/share/php
          for command in php composer go pnpm; do
            if command -v "$command" >/dev/null; then echo "Unexpected preinstalled tool: $command" >&2; exit 1; fi
          done
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git sudo unzip xz-utils libstdc++6
          useradd -m -s /bin/bash qualifier
          qualifier_home=$(getent passwd qualifier | cut -d: -f6)
          test -n "$qualifier_home"
          echo "QUALIFICATION_OUTPUT=$qualifier_home/qualification" >> "$GITHUB_ENV"
          echo 'qualifier ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/qualifier
          chmod 440 /etc/sudoers.d/qualifier
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Qualify all host tools without runner development packages
        shell: bash
        env:
          TOOL_LAYOUT: ${{ matrix.layout }}
        run: |
          set -euo pipefail
          install -m 755 "$(command -v bun)" /usr/local/bin/bun
          sudo -u qualifier env PATH="/usr/local/bin:$PATH" GITHUB_ACTIONS=true \
            QUALIFICATION_PLATFORM=ubuntu QUALIFICATION_TOOL_LAYOUT="$TOOL_LAYOUT" \
            bash .github/scripts/qualify-portable-setup.sh tools-only "$QUALIFICATION_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-tools-clean-${{ matrix.layout }}-evidence
          path: ${{ env.QUALIFICATION_OUTPUT }}/evidence/
          if-no-files-found: warn
          retention-days: 14

  native-runtime:
    needs: resource-policy
    if: ${{ !inputs.native_runtime_run_id }}
    uses: ./.github/workflows/private-runtime-validation.yml

  native-reuse:
    needs: resource-policy
    if: ${{ inputs.native_runtime_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify the producer and unchanged native inputs
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUNTIME_RUN_ID: ${{ inputs.native_runtime_run_id }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_RUNTIME_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'native_runtime_run_id must be a positive run ID' >&2; exit 1; }
          producer_path=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUNTIME_RUN_ID" --jq .path)
          case "$producer_path" in
            .github/workflows/portable-setup-validation.yml) producer_job='native-runtime / native' ;;
            .github/workflows/private-runtime-validation.yml) producer_job='native' ;;
            *) echo 'The source must be an approved native qualification workflow' >&2; exit 1 ;;
          esac
          native_source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUNTIME_RUN_ID" --jq .head_sha)
          [[ "$native_source_sha" =~ ^[a-f0-9]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUNTIME_RUN_ID/jobs?filter=latest&per_page=100" --jq ".jobs[] | select(.name == \"$producer_job\") | .conclusion")" = success || { echo 'The source did not produce a successfully qualified native runtime' >&2; exit 1; }
          git fetch --no-tags --depth=1 origin "$native_source_sha"
          git diff --exit-code "$native_source_sha" HEAD -- .github/workflows/private-runtime-validation.yml .github/actions/prepare-agent .github/fixtures .github/scripts/restore-pi-runtime.py .github/scripts/install-qualification-bwrap.sh agent/package.json agent/bun.lock agent/extensions/sandbox/runtime agent/extensions/think-in-code agent/extensions/_shared ':(exclude)agent/extensions/sandbox/runtime/development-tools.integration.test.ts'
          printf '%s' "$native_source_sha" > "$RUNNER_TEMP/native-source-sha"
          printf '%s' "$producer_job" > "$RUNNER_TEMP/native-source-job"
      - uses: actions/download-artifact@v4
        with:
          name: qualified-native-runtime
          run-id: ${{ inputs.native_runtime_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-runtime
      - name: Verify the archive and record its source
        env:
          NATIVE_RUNTIME_RUN_ID: ${{ inputs.native_runtime_run_id }}
        run: |
          set -euo pipefail
          native_archive_sha=$(cut -d ' ' -f1 "$RUNNER_TEMP/native-runtime/qualified-native-runtime.sha256")
          [[ "$native_archive_sha" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$native_archive_sha" "$RUNNER_TEMP/native-runtime/qualified-native-runtime.tgz" | sha256sum --check
          python3 - "$NATIVE_RUNTIME_RUN_ID" "$(cat "$RUNNER_TEMP/native-source-sha")" "$native_archive_sha" "$(cat "$RUNNER_TEMP/native-source-job")" <<'PY' > "$RUNNER_TEMP/native-runtime/native-runtime-source.json"
          import json, os, sys
          json.dump({"schema": 1, "sourceRun": int(sys.argv[1]), "sourceCommit": sys.argv[2], "targetCommit": os.environ["GITHUB_SHA"], "archiveSha256": sys.argv[3], "producerJob": sys.argv[4], "producerConclusion": "success", "inputCheck": "unchanged"}, sys.stdout, indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-native-runtime
          path: ${{ runner.temp }}/native-runtime/
          if-no-files-found: error
          retention-days: 14

  ubuntu:
    needs: [native-runtime, native-reuse, tool-discovery]
    if: ${{ always() && !cancelled() && needs['tool-discovery'].result == 'success' && (needs['native-runtime'].result == 'success' || needs['native-reuse'].result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/download-artifact@v4
        with:
          name: qualified-native-runtime
          path: ${{ runner.temp }}/native-runtime
      - name: Qualify on the native Ubuntu kernel
        env:
          QUALIFICATION_TOOL_LAYOUT: ${{ matrix.repetition == 1 && 'system' || 'mise' }}
          QUALIFICATION_PLATFORM: ubuntu
        run: bash .github/scripts/qualify-portable-setup.sh "$RUNNER_TEMP/native-runtime" "$RUNNER_TEMP/portable-qualification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-setup-ubuntu-${{ matrix.repetition }}-evidence
          path: ${{ runner.temp }}/portable-qualification/evidence/
          if-no-files-found: warn
          retention-days: 14

  wsl2:
    needs: [native-runtime, native-reuse, tool-discovery]
    if: ${{ always() && !cancelled() && needs['tool-discovery'].result == 'success' && (needs['native-runtime'].result == 'success' || needs['native-reuse'].result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Preserve Unix line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qualified-native-runtime
          path: ${{ runner.temp }}/native-runtime
      - name: Install Ubuntu 24.04 under WSL2
        shell: pwsh
        timeout-minutes: 10
        run: |
          wsl --set-default-version 2
          if ($LASTEXITCODE -ne 0) { throw "Cannot select WSL2" }
          wsl --install --distribution Ubuntu-24.04 --web-download --no-launch
          if ($LASTEXITCODE -ne 0) { throw "Cannot install Ubuntu under WSL2" }
          wsl --list --verbose
          wsl -d Ubuntu-24.04 -u root --exec bash -lc 'set -euo pipefail; uname -r | grep -i microsoft-standard-WSL2; apt-get update; apt-get install -y git sudo; useradd -m -s /bin/bash qualifier; echo "qualifier ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/qualifier; chmod 440 /etc/sudoers.d/qualifier'
          if ($LASTEXITCODE -ne 0) { throw "WSL2 prerequisite failed" }
      - name: Qualify inside the WSL2 Linux filesystem
        shell: pwsh
        run: |
          $source = (wsl -d Ubuntu-24.04 --exec wslpath -a "$env:GITHUB_WORKSPACE").Trim()
          $runtime = (wsl -d Ubuntu-24.04 --exec wslpath -a "$env:RUNNER_TEMP/native-runtime").Trim()
          $qualifierHome = ((wsl -d Ubuntu-24.04 --exec getent passwd qualifier).Trim() -split ":")[5]
          if (-not $qualifierHome) { throw "Cannot resolve qualifier home" }
          wsl -d Ubuntu-24.04 -u qualifier --exec env GITHUB_ACTIONS=true CI=true QUALIFICATION_TOOL_LAYOUT=${{ matrix.repetition == 1 && 'system' || 'mise' }} QUALIFICATION_PLATFORM=wsl2 QUALIFICATION_SOURCE_SHA=$env:GITHUB_SHA bash -lc "set -euo pipefail; git config --global --add safe.directory '$source/.git'; git clone --no-local '$source' '$qualifierHome/source'; cd '$qualifierHome/source'; bash .github/scripts/qualify-portable-setup.sh '$runtime' '$qualifierHome/qualification'"
          if ($LASTEXITCODE -ne 0) { throw "WSL2 qualification failed" }
      - name: Collect WSL2 evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/wsl-evidence" | Out-Null
          $destination = (wsl -d Ubuntu-24.04 --exec wslpath -a "$env:RUNNER_TEMP/wsl-evidence").Trim()
          $qualifierHome = ((wsl -d Ubuntu-24.04 --exec getent passwd qualifier).Trim() -split ":")[5]
          if (-not $qualifierHome) { throw "Cannot resolve qualifier home" }
          wsl -d Ubuntu-24.04 -u root --exec bash -lc "if test -d '$qualifierHome/qualification/evidence'; then cp -a '$qualifierHome/qualification/evidence'/. '$destination/'; fi"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-setup-wsl2-${{ matrix.repetition }}-evidence
          path: ${{ runner.temp }}/wsl-evidence/
          if-no-files-found: warn
          retention-days: 14
