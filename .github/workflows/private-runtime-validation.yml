name: Pi private runtime native validation

on:
  push:
    branches: ["codex/private-runtime-validation-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          path: .pi
      - uses: actions/checkout@v4
        with:
          repository: abdwhb-png/zerobox
          ref: ed2e0a1ceb3ac1b1552ef89aebed796ea1f59013
          path: projects/zerobox
      - uses: actions/checkout@v4
        with:
          repository: abdwhb-png/pi
          ref: 0bb2d904515eed3311028dadcb0edbf3637fa93e
          path: projects/pi-core
      - uses: actions/checkout@v4
        with:
          repository: abdwhb-png/pi-test-harness
          ref: 87bd1c0ec7c84b62ed29f887bccc062b082c7fea
          path: projects/pi-integrations/pi-test-harness
      - uses: actions/checkout@v4
        with:
          repository: abdwhb-png/pi-fancy-footer
          ref: 53e304c7695b5b3e9e1d01ac456ed342432b9169
          path: projects/pi-integrations/pi-fancy-footer
      - uses: actions/checkout@v4
        with:
          repository: abdwhb-png/pi-mcp-adapter
          ref: 53733d3d7b052618896d691fe5bfb4b917f979da
          path: projects/pi-integrations/pi-mcp-adapter
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/zerobox
      - name: Prepare the disposable native runner
        run: |
          set -euo pipefail
          python3 .pi/agent/extensions/sandbox/runtime/distribution/native-ci.py --check-host
          sudo apt-get update
          sudo apt-get install -y bubblewrap libcap-dev netcat-openbsd fd-find=9.0.0-1
          if ! test -e /usr/bin/node; then
            sudo ln -s "$(command -v node)" /usr/bin/node
          fi
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          npm install --global --ignore-scripts --no-audit --no-fund sfw@2.0.6
          sfw --version
      - name: Restore the exact Pi and test harness sources
        env:
          npm_config_ignore_scripts: "true"
          npm_config_allow_git: none
        run: |
          set -euo pipefail
          cd projects/pi-core
          sfw npm ci
          model_data_root=$(mktemp -d "${RUNNER_TEMP}/pi-ai-model-data.XXXXXX")
          sfw npm pack @earendil-works/pi-ai@0.85.0 --pack-destination "$model_data_root" --ignore-scripts
          echo "46188bdacb555a07466a0111f3963f20932a16199e4d6cfb8d44a7fe5fc6e342  $model_data_root/earendil-works-pi-ai-0.85.0.tgz" | sha256sum -c -
          mkdir -p packages/ai/src/providers
          tar -xzf "$model_data_root/earendil-works-pi-ai-0.85.0.tgz" \
            -C packages/ai/src/providers --strip-components=3 package/dist/providers/data
          npm run build:offline
          pi_tarball_root=$(node -e 'const path = require("node:path"); const manifest = require("../../.pi/agent/package.json"); const spec = manifest.dependencies["@earendil-works/pi-coding-agent"]; process.stdout.write(path.dirname(path.resolve("../../.pi/agent", spec.slice("file:".length))))')
          mkdir -p "$pi_tarball_root"
          node -e 'const manifest = require("../../.pi/agent/package.json"); console.log(Object.keys(manifest.dependencies).filter((name) => name.startsWith("@earendil-works/")).sort().join("\n"))' > "$RUNNER_TEMP/pi-package-names"
          while IFS= read -r pi_package; do
            sfw npm pack --workspace "$pi_package" --pack-destination "$pi_tarball_root" --ignore-scripts
          done < "$RUNNER_TEMP/pi-package-names"
          cd ../pi-integrations/pi-test-harness
          sfw npm ci
          npm run build
          cd ../pi-fancy-footer
          sfw npm ci --ignore-scripts --no-audit --no-fund
          cd ../pi-mcp-adapter
          sfw npm ci --ignore-scripts --no-audit --no-fund
          cd ../../../.pi/agent
          sfw bun install --frozen-lockfile --ignore-scripts
          cd extensions/sandbox
          sfw bun install --frozen-lockfile --ignore-scripts
          sfw npm install --prefix "$RUNNER_TEMP/permission" --save-exact --ignore-scripts --no-audit --no-fund @gotgenes/pi-permission-system@24.0.0
          mkdir -p ../../node_modules/@gotgenes
          ln -s "$RUNNER_TEMP/permission/node_modules/@gotgenes/pi-permission-system" ../../node_modules/@gotgenes/pi-permission-system
          ln -s "$GITHUB_WORKSPACE/projects/pi-integrations/pi-fancy-footer" ../../node_modules/pi-fancy-footer
          ln -s "$GITHUB_WORKSPACE/projects/pi-integrations/pi-mcp-adapter" ../../node_modules/pi-mcp-adapter
          mkdir -p ../../npm/node_modules/@gotgenes
          ln -s "$RUNNER_TEMP/permission/node_modules/@gotgenes/pi-permission-system" ../../npm/node_modules/@gotgenes/pi-permission-system
      - name: Verify installed integration imports before compiling
        working-directory: .pi/agent
        run: |
          ./bin/fd --version
          bun -e 'await import("./extensions/_shared/fancy-footer.ts"); await import("pi-mcp-adapter");'
          test -f npm/node_modules/@gotgenes/pi-permission-system/src/index.ts
          bun -e 'import { hostToolReadClosure } from "./extensions/sandbox/runtime/integration-fixtures.ts"; for (const tool of ["node", "perl", "unshare", "bwrap", "mount", "systemctl", "curl", "nc", "git", "fdfind"]) await hostToolReadClosure(`/usr/bin/${tool}`);'
      - name: Validate Analysis inputs before compiling
        working-directory: .pi/agent
        run: |
          python3 extensions/sandbox/runtime/distribution/build.py verify-analysis-inputs \
            --lock extensions/sandbox/runtime/distribution/input-lock.json --agent-root .
      - name: Run Pi boundary regression suites
        working-directory: .pi/agent
        run: |
          env -u PI_SANDBOX_RUNTIME_BUNDLE -u PI_SANDBOX_ZEROBOX_BINARY -u PI_SANDBOX_ZEROBOX_SHA256 \
            bun test --isolate extensions/_shared/command-execution extensions/_shared/sandbox-runtime extensions/bash-execution extensions/sandbox extensions/think-in-code
      - name: Replay patches and build the static engine
        working-directory: projects/zerobox
        run: |
          ./scripts/sync.sh
          sfw cargo fetch --locked
          cargo rustc --offline --locked --release -p zerobox --bin zerobox --target x86_64-unknown-linux-gnu -- -C target-feature=+crt-static
      - name: Assemble with the pinned Ubuntu builder and verify all inputs
        run: |
          python3 .pi/agent/extensions/sandbox/runtime/distribution/native-ci.py \
            --engine-root projects/zerobox --agent-root .pi/agent \
            --input-root "$RUNNER_TEMP/private-runtime" \
            --version "native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Run every explicit Zerobox candidate contract on the native kernel
        working-directory: .pi/agent
        env:
          PI_SANDBOX_ZEROBOX_SOURCE_ROOT: ${{ github.workspace }}/projects/zerobox
        run: |
          bun run test:sandbox:zerobox-candidate
      - name: Verify atomic installation through a fresh Pi session
        working-directory: .pi/agent
        run: |
          bun extensions/sandbox/runtime/distribution/stage-release.ts \
            --candidate-root "$PI_SANDBOX_RUNTIME_BUNDLE" --runtime-base "$HOME/.pi/runtimes" \
            --managed-binary "$HOME/.pi/bin/zerobox" \
            --provenance-source "$PI_SANDBOX_RUNTIME_BUNDLE/provenance.json" \
            --expected-binary-sha256 "$PI_SANDBOX_ZEROBOX_SHA256"
          unset PI_SANDBOX_RUNTIME_BUNDLE PI_SANDBOX_ZEROBOX_BINARY PI_SANDBOX_ZEROBOX_SHA256
          PI_SANDBOX_INSTALLED_CONTRACT=1 bun test --isolate extensions/sandbox/runtime/installed-runtime.integration.test.ts
