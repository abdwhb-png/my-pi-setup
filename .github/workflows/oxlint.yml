name: Lint

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oxlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Restore the frozen Pi archives
        run: python3 ../.github/scripts/restore-pi-runtime.py --agent-root . --fixture-root ../.github/fixtures/pi-core-1.1.0
      - name: Install locked dependencies through Socket Firewall
        env:
          npm_config_ignore_scripts: 'true'
          npm_config_allow_git: none
        run: |
          set -euo pipefail
          npm view sfw@2.0.6 version | grep -Fx 2.0.6
          npm install --global --ignore-scripts --no-audit --no-fund sfw@2.0.6
          sfw --version
          sfw bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
